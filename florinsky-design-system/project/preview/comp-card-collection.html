<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:24px;display:flex;justify-content:center;}
  .card{width:240px;border-radius:var(--r-card);background:var(--frame);box-shadow:var(--elev-md);padding:14px;}
  .frame{position:relative;border-radius:calc(var(--r-card) - 14px);overflow:hidden;aspect-ratio:293/300;}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:rgba(249,244,240,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .cap span.t{font:600 17px/1.4 var(--font-sans);color:var(--ink);}
  .pin{width:32px;height:32px;border-radius:9999px;display:grid;place-items:center;background:rgba(249,244,240,.7);box-shadow:var(--elev-sm);}
  .pin i{color:var(--ink-mauve);}
</style></head><body>
  <div class="card">
    <div class="frame">
      <img src="../assets/collection-whimsical-hydrangea.png" alt="Whimsical Hydrangea" />
      <div class="cap"><span class="t">Whimsical Hydrangea</span><span class="pin"><i data-lucide="arrow-up-right"></i></span></div>
    </div>
  </div>
  <script>lucide.createIcons({attrs:{width:18,height:18,'stroke-width':2}});</script>
</body></html>
