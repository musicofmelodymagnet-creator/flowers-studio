<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:28px 32px;display:flex;gap:20px;}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:16px;box-shadow:var(--elev-sm);}
  .n{font:500 14px/1.3 var(--font-sans);color:var(--ink);}
  .h{font:var(--body);color:var(--ink-muted);font-size:12px;}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--bg)"></div><span class="n">Base</span><span class="h">#EADCDB</span></div>
  <div class="sw"><div class="chip" style="background:var(--surface)"></div><span class="n">Surface</span><span class="h">#F9F4F0</span></div>
  <div class="sw"><div class="chip" style="background:var(--surface-rose)"></div><span class="n">Dusty Rose</span><span class="h">#DECED2</span></div>
  <div class="sw"><div class="chip" style="background:var(--frame)"></div><span class="n">Photo Frame</span><span class="h">#C3BDCF</span></div>
  <div class="sw"><div class="chip" style="background:var(--surface-distinct)"></div><span class="n">Distinction</span><span class="h">#DBCFE2</span></div>
  <div class="sw"><div class="chip" style="background:var(--surface-form)"></div><span class="n">Form (cool)</span><span class="h">#D4D6DB</span></div>
</body></html>
