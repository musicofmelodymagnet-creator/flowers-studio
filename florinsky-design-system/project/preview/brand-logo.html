<!-- @dsCard group="Brand" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Plus+Jakarta+Sans:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{display:flex;gap:0;font-family:var(--font-sans);}
  .half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:36px 0;}
  .light{background:var(--bg);}
  .dark{background:var(--footer-bg);}
</style></head><body>
  <div class="half light">
    <span style="font:var(--wordmark);font-size:40px;letter-spacing:.05em;color:var(--brand)">FLORINSKY</span>
    <span class="fl-eyebrow" style="font-size:13px;letter-spacing:.45em;opacity:.6">The Art of Floral Design</span>
  </div>
  <div class="half dark">
    <span style="font:var(--wordmark);font-size:40px;letter-spacing:.05em;color:var(--on-dark)">FLORINSKY</span>
    <span style="font:13px/1.5 var(--font-sans);letter-spacing:.45em;text-transform:uppercase;color:var(--on-dark);opacity:.6">The Art of Floral Design</span>
  </div>
</body></html>
