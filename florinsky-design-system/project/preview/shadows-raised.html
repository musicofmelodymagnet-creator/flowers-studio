<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:36px 32px;display:flex;gap:32px;justify-content:center;align-items:center;}
  .sw{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .box{width:120px;height:84px;border-radius:24px;background:var(--bg);}
  .n{font:500 14px/1.3 var(--font-sans);color:var(--ink);}
  .h{font:12px/1.3 var(--font-sans);color:var(--ink-muted);}
</style></head><body>
  <div class="sw"><div class="box" style="box-shadow:var(--elev-sm)"></div><span class="n">Small</span><span class="h">±6px / 16</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--elev-md)"></div><span class="n">Medium</span><span class="h">±10px / 20</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--elev-lg)"></div><span class="n">Large</span><span class="h">±15px / 30</span></div>
</body></html>
