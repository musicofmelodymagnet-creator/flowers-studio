<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:34px 32px;display:flex;gap:40px;align-items:center;justify-content:center;}
  .sw{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .btn{border:none;border-radius:var(--r-pill);font:var(--btn);text-transform:uppercase;letter-spacing:.1em;padding:16px 32px;background:rgba(255,255,255,.002);cursor:default;}
  .rest{color:var(--ink-mauve);box-shadow:var(--elev-md);}
  .hover{color:var(--brand-deep);box-shadow:var(--elev-hover);transform:translateY(-3px);}
  .press{color:var(--brand-deep);box-shadow:var(--inset-md);transform:scale(.97);}
  .lab{font:12px/1.3 var(--font-sans);color:var(--ink-muted);}
</style></head><body>
  <div class="sw"><button class="btn rest">Explore</button><span class="lab">Rest</span></div>
  <div class="sw"><button class="btn hover">Explore</button><span class="lab">Hover · lift + accent</span></div>
  <div class="sw"><button class="btn press">Explore</button><span class="lab">Pressed · sink</span></div>
</body></html>
