<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:36px 32px;display:flex;gap:30px;justify-content:center;align-items:center;}
  .sw{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .box{width:120px;height:84px;border-radius:24px;background:var(--bg);}
  .disc{width:72px;height:72px;border-radius:9999px;background:var(--surface-rose);box-shadow:var(--inset-md);}
  .n{font:500 14px/1.3 var(--font-sans);color:var(--ink);}
  .h{font:12px/1.3 var(--font-sans);color:var(--ink-muted);}
</style></head><body>
  <div class="sw"><div class="box" style="box-shadow:var(--inset-md)"></div><span class="n">Pressed well</span><span class="h">inset ±8 / 16</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--inset-input)"></div><span class="n">Input field</span><span class="h">inset ±6 / 12</span></div>
  <div class="sw"><div class="disc"></div><span class="n">Icon well</span><span class="h">inset disc</span></div>
</body></html>
