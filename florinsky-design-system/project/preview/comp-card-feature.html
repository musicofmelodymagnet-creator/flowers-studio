<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:24px;display:flex;justify-content:center;}
  .card{width:300px;border-radius:var(--r-card);background:var(--surface-rose);box-shadow:var(--elev-md);padding:28px 28px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .well{width:60px;height:60px;border-radius:9999px;display:grid;place-items:center;background:var(--surface-rose);box-shadow:var(--inset-md);}
  .well i{color:var(--ink-mauve);}
  h3{font:700 28px/1.2 var(--font-sans);color:var(--ink);margin:4px 0 0;letter-spacing:-.01em;}
  p{font:var(--body);color:var(--ink-soft);margin:0;}
</style></head><body>
  <div class="card">
    <div class="well"><i data-lucide="palette"></i></div>
    <h3>Bespoke Style</h3>
    <p>Unique floral compositions created specifically for your celebration's theme.</p>
  </div>
  <script>lucide.createIcons({attrs:{width:28,height:28,'stroke-width':1.75}});</script>
</body></html>
