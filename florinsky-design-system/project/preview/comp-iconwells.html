<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:34px 32px;display:flex;gap:40px;align-items:center;justify-content:center;}
  .sw{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .well{width:64px;height:64px;border-radius:9999px;display:grid;place-items:center;}
  .rose{background:var(--surface-rose);box-shadow:var(--inset-md);}
  .social{width:64px;height:64px;border-radius:9999px;background:var(--bg);box-shadow:var(--elev-md);display:grid;place-items:center;}
  .n{font:12px/1.3 var(--font-sans);color:var(--ink-muted);}
  i{color:var(--ink-mauve);}
</style></head><body>
  <div class="sw"><div class="well rose"><i data-lucide="truck"></i></div><span class="n">truck</span></div>
  <div class="sw"><div class="well rose"><i data-lucide="wrench"></i></div><span class="n">wrench</span></div>
  <div class="sw"><div class="well rose"><i data-lucide="palette"></i></div><span class="n">palette</span></div>
  <div class="sw"><div class="social"><i data-lucide="instagram" style="color:var(--ink)"></i></div><span class="n">instagram</span></div>
  <div class="sw"><div class="social"><i data-lucide="facebook" style="color:var(--ink)"></i></div><span class="n">facebook</span></div>
  <script>lucide.createIcons({attrs:{width:30,height:30,'stroke-width':1.75}});</script>
</body></html>
