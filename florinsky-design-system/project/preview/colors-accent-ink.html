<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:28px 32px;display:flex;gap:18px;}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:16px;border:1px solid rgba(0,0,0,.04);}
  .n{font:500 14px/1.3 var(--font-sans);color:var(--ink);}
  .h{font:var(--body);color:var(--ink-muted);font-size:12px;}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--brand)"></div><span class="n">Brand</span><span class="h">#A593B5</span></div>
  <div class="sw"><div class="chip" style="background:var(--brand-deep)"></div><span class="n">Brand Deep</span><span class="h">#8C7A9E</span></div>
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><span class="n">Ink</span><span class="h">#2D2626</span></div>
  <div class="sw"><div class="chip" style="background:var(--ink-soft)"></div><span class="n">Ink Soft</span><span class="h">#4E4444</span></div>
  <div class="sw"><div class="chip" style="background:var(--ink-mauve)"></div><span class="n">Ink Mauve</span><span class="h">#6B5A5B</span></div>
  <div class="sw"><div class="chip" style="background:var(--footer-bg)"></div><span class="n">Footer</span><span class="h">#63535B</span></div>
</body></html>
