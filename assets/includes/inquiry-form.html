<div class="cc-inquiry-wrap">
  <div class="inq-tabs" role="tablist">
    <button class="inq-tab inq-tab--active" role="tab" data-tab="inquiry" aria-selected="true">Quick Inquiry</button>
    <button class="inq-tab" role="tab" data-tab="reserve" aria-selected="false">Reserve Your Wall</button>
  </div>

  <section class="inquiry" id="contact" aria-label="Inquiry form">

    <div class="inquiry-header">
      <h2 id="inqTitle">Send an Inquiry</h2>
    </div>

    <form class="form-body" id="inquiryForm" novalidate>
      <div class="form-row">
        <div class="form-field">
          <label for="field-name">Name<span class="form-req">*</span></label>
          <input id="field-name" class="form-input" type="text" autocomplete="given-name" />
        </div>
        <div class="form-field form-field--extended">
          <label for="field-lastname">Last Name<span class="form-req">*</span></label>
          <input id="field-lastname" class="form-input" type="text" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="field-email">Email<span class="form-req">*</span></label>
          <input id="field-email" class="form-input" type="email" autocomplete="email" />
        </div>
        <div class="form-field form-field--extended">
          <label for="field-phone">Phone<span class="form-req">*</span></label>
          <input id="field-phone" class="form-input" type="tel" autocomplete="tel" />
        </div>
      </div>

      <div class="form-field">
        <div class="form-date-header">
          <label for="field-date">Event Date<span class="form-req">*</span></label>
          <label class="form-date-unsure" for="field-date-unsure">
            <input type="checkbox" id="field-date-unsure" />
            <span>Not sure yet</span>
          </label>
        </div>
        <div class="form-date-wrap" id="fieldDateWrap">
          <input id="field-date" class="form-input" type="text" placeholder="mm/dd/yyyy" />
          <span class="form-date-icon" id="fieldDateIcon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="form-field form-field--extended">
        <label for="field-location">Event Location<span class="form-req">*</span></label>
        <input id="field-location" class="form-input" type="text" placeholder="Venue name and address" />
      </div>

      <div class="form-row form-row--extended">
        <div class="form-field">
          <label for="field-event-type">Type of Event<span class="form-req">*</span></label>
          <select id="field-event-type" class="form-select">
            <option value="" disabled selected></option>
            <option value="Wedding">Wedding</option>
            <option value="Bridal Shower">Bridal Shower</option>
            <option value="Baby Shower">Baby Shower</option>
            <option value="Birthday Party">Birthday Party</option>
            <option value="Corporate Event">Corporate Event</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-field">
          <label for="field-wall-color">Wall Color<span class="form-req">*</span></label>
          <select id="field-wall-color" class="form-select">
            <option value="" disabled selected></option>
            <option value="White">White</option>
            <option value="Burgundy">Burgundy</option>
            <option value="Pink">Pink</option>
            <option value="Green">Green</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label for="field-message">Message<span class="form-req">*</span></label>
        <textarea id="field-message" class="form-textarea" rows="4" placeholder="Tell us about your event"></textarea>
      </div>

      <!-- HoneyPot: hidden from users, bots fill it → rejected server-side -->
      <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none">
        <label for="hp-website">Website</label>
        <input type="text" id="hp-website" name="website" tabindex="-1" autocomplete="off" />
      </div>

      <div class="form-submit">
        <button type="submit" class="neo-btn neo-btn--solid" id="submitBtn">
          Send Inquiry
        </button>
        <p class="form-privacy-note">We'll only use your information to respond to your request.</p>
        <p class="form-consent" id="inqConsent">
          By submitting this inquiry, you confirm that you have read and agree to our&nbsp;<a href="/privacy-policy.html" class="form-consent-link" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
        </p>
      </div>
    </form>

  </section>
</div>
